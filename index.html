<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="darkreader-lock">
    <title>A2Z DSA Course Roadmap</title>
    <!-- Google Identity Services — for Sign in with Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* ══════════════════════════════════════════════════════════════
           DESIGN TOKENS
        ══════════════════════════════════════════════════════════════ */
        :root {
            /* palette */
            --bg:               #1a1a2e;
            --surface:          #16213e;
            --surface-2:        #0f3460;
            --step-bg:          #1e2a45;
            --step-hover:       #253352;
            --substep-bg:       #1a2438;
            --substep-hover:    #1f2d47;
            --done-bg:          #0d3320;
            --done-hover:       #0f3d26;
            --row-alt:          rgba(255,255,255,0.02);
            --row-done-bg:      rgba(22,160,80,0.08);

            /* accent */
            --green:            #1db954;
            --green-dim:        #168f3f;
            --blue:             #4a9eff;
            --orange:           #f5a623;
            --red:              #e52d27;
            --text:             #e8eaf0;
            --text-dim:         #8892a4;
            --text-done:        #5eead4;
            --border:           rgba(255,255,255,0.08);
            --border-strong:    rgba(255,255,255,0.14);

            /* sizing */
            --radius-lg:        10px;
            --radius-md:        7px;
            --radius-sm:        5px;
        }

        /* ══════════════════════════════════════════════════════════════
           RESET / BASE
        ══════════════════════════════════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; }

        html { font-size: 14px; }
        @media (max-width: 600px) { html { font-size: 12px; } }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ══════════════════════════════════════════════════════════════
           LOGIN SCREEN
        ══════════════════════════════════════════════════════════════ */
        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
        }

        #login-card {
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        #login-card .lock-icon { font-size: 2.4rem; margin-bottom: 0.6rem; }

        #login-card h1 {
            font-size: 1.4rem;
            color: var(--text);
            margin: 0 0 0.4rem;
            border: none;
            padding: 0;
            font-weight: 700;
        }

        #login-card p {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin: 0 0 1.6rem;
            line-height: 1.6;
        }

        #login-error {
            color: #f5a6a6;
            font-size: 0.82rem;
            margin-top: 0.9rem;
            display: none;
        }
        #login-error.show { display: block; }

        /* ══════════════════════════════════════════════════════════════
           SYNC STATUS BANNER
        ══════════════════════════════════════════════════════════════ */
        #sync-status {
            position: fixed;
            top: 0.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            font-size: 0.75rem;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            white-space: nowrap;
            display: none;
            pointer-events: none;
        }
        #sync-status.info    { display: block; background: #1a3a5c; color: #aad4f5; }
        #sync-status.success { display: block; background: #0d3320; color: #5eead4; }
        #sync-status.error   { display: block; background: #4a1a1a; color: #f5a6a6; }
        #sync-status.warning { display: block; background: #3a2a00; color: #f5d06e; }

        /* ══════════════════════════════════════════════════════════════
           MAIN CONTAINER  — full-width, no card box
        ══════════════════════════════════════════════════════════════ */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.2rem 3rem;
        }

        /* ══════════════════════════════════════════════════════════════
           PAGE HEADER
        ══════════════════════════════════════════════════════════════ */
        .roadmap-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0 1rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .roadmap-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            margin: 0;
            letter-spacing: -0.01em;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        #user-display {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .toggle-all-btn {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.3rem 0.75rem;
            border-radius: 20px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-all-btn:hover { background: var(--step-hover); }

        .logout-btn {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.3rem 0.75rem;
            border-radius: 20px;
            border: 1px solid rgba(229,45,39,0.4);
            background: transparent;
            color: #e57373;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover { background: rgba(229,45,39,0.1); }

        /* ══════════════════════════════════════════════════════════════
           STEP (MAIN COLLAPSIBLE)
        ══════════════════════════════════════════════════════════════ */
        .collapsible {
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.65rem 0.9rem;
            margin-top: 0.5rem;
            border-radius: var(--radius-lg);
            background: var(--step-bg);
            color: var(--text);
            font-size: 0.92rem;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            transition: background 0.2s;
            z-index: 1;
        }

        .collapsible::before {
            content: '';
            position: absolute;
            inset: 0;
            width: var(--progress-width, 0%);
            background: var(--green-dim);
            opacity: 0.35;
            transition: width 0.4s ease-out;
            z-index: 0;
        }

        .collapsible:hover  { background: var(--step-hover); }
        .collapsible.completed { background: var(--done-bg); }
        .collapsible.completed:hover { background: var(--done-hover); }

        /* ══════════════════════════════════════════════════════════════
           SUB-STEP (NESTED COLLAPSIBLE)
        ══════════════════════════════════════════════════════════════ */
        .sub-collapsible {
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.85rem 0.5rem 1.4rem;
            margin-top: 0.25rem;
            border-radius: var(--radius-md);
            background: var(--substep-bg);
            color: var(--text-dim);
            font-size: 0.82rem;
            font-weight: 500;
            position: relative;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
            z-index: 1;
        }

        .sub-collapsible::before {
            content: '';
            position: absolute;
            inset: 0;
            width: var(--progress-width, 0%);
            background: var(--green);
            opacity: 0.18;
            transition: width 0.4s ease-out;
            z-index: 0;
        }

        .sub-collapsible:hover  { background: var(--substep-hover); color: var(--text); }
        .sub-collapsible.completed { background: var(--done-bg); color: var(--text-done); }
        .sub-collapsible.completed:hover { background: var(--done-hover); }

        /* shared title / counter / toggle icon */
        .collapsible-title,
        .progress-counter,
        .collapsible::after,
        .sub-collapsible::after {
            position: relative;
            z-index: 1;
        }

        .collapsible-title { flex: 1; }

        .progress-counter {
            font-size: 0.68rem;
            font-weight: 600;
            background: rgba(0,0,0,0.3);
            padding: 0.15rem 0.55rem;
            border-radius: 20px;
            white-space: nowrap;
            color: var(--text);
        }

        .collapsible::after,
        .sub-collapsible::after {
            content: '+';
            font-size: 1rem;
            font-weight: 700;
            width: 1.4rem;
            height: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            transition: transform 0.25s ease;
            flex-shrink: 0;
        }

        .collapsible.active::after,
        .sub-collapsible.active::after { transform: rotate(45deg); }

        /* ══════════════════════════════════════════════════════════════
           COLLAPSE PANELS
        ══════════════════════════════════════════════════════════════ */
        .content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-in-out;
            padding: 0 0 0 0.4rem;
        }

        .sub-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease-in-out;
        }

        /* ══════════════════════════════════════════════════════════════
           TABLE
        ══════════════════════════════════════════════════════════════ */
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 0.3rem;
            margin-bottom: 0.4rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 720px;
            background: var(--surface);
        }

        th {
            background: rgba(255,255,255,0.04);
            color: var(--text-dim);
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.45rem 0.3rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 0.3rem 0.25rem;
            text-align: center;
            vertical-align: middle;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text);
        }

        tr:last-child td { border-bottom: none; }
        tr:nth-child(even) { background: var(--row-alt); }
        tr:hover td { background: rgba(255,255,255,0.03); }

        /* column widths */
        .topic-cell   { text-align: left; width: 33%; font-weight: 500; }
        .notes-header { width: 9%; }
        thead th:not(.topic-cell):not(.notes-header) { width: 6.5%; }

        .topic-title {
            font-size: 0.8rem;
            padding: 0.2rem 0.4rem;
            line-height: 1.4;
            color: var(--text);
        }

        /* completed rows */
        tr.completed td { background: var(--row-done-bg) !important; }
        tr.completed .topic-title { color: var(--text-done); }
        tr.completed a { color: var(--text-done) !important; }

        /* difficulty left border */
        .difficulty-easy   td:first-child { border-left: 3px solid var(--green); }
        .difficulty-medium td:first-child { border-left: 3px solid var(--orange); }
        .difficulty-hard   td:first-child { border-left: 3px solid var(--red); }

        /* icon cells */
        .link-cell { cursor: pointer; transition: background 0.15s; }
        .link-cell:hover { background: rgba(255,255,255,0.05) !important; }
        .link-cell a {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.3rem;
            color: var(--text-dim);
            text-decoration: none;
        }
        .link-cell img { width: 20px; height: 20px; }
        .na-cell { color: #444; font-size: 0.9rem; }

        /* checkbox */
        .status-cell { cursor: pointer; }

        .status-checkbox {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            margin: auto;
            width: 1rem;
            height: 1rem;
            border: 0.13em solid var(--text-dim);
            border-radius: 0.2em;
            display: grid;
            place-content: center;
            pointer-events: none;
            transition: border-color 0.15s;
        }

        .status-checkbox::before {
            content: "";
            width: 0.55em;
            height: 0.55em;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transform: scale(0);
            transform-origin: bottom left;
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em var(--green);
        }

        .status-checkbox:checked { border-color: var(--green); }
        .status-checkbox:checked::before { transform: scale(1); }

        /* notes cell */
        .notes-cell { padding: 0.2rem; }

        .notes-btn {
            font-size: 0.68rem;
            padding: 0.2rem 0.45rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .notes-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
        .notes-btn.has-notes { color: var(--orange); border-color: rgba(245,166,35,0.4); }
        tr.completed .notes-btn { color: var(--text-done); border-color: rgba(94,234,212,0.3); }

        /* ══════════════════════════════════════════════════════════════
           NOTES MODAL
        ══════════════════════════════════════════════════════════════ */
        #notes-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        #notes-modal-overlay.open { display: flex; }

        #notes-modal {
            background: #1e2535;
            border: 1px solid var(--border-strong);
            border-radius: 12px;
            width: min(600px, 94vw);
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 64px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        #notes-modal-header {
            background: var(--surface-2);
            padding: 0.8rem 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        #notes-modal-title {
            flex: 1;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #notes-modal-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0.1rem 0.3rem;
            border-radius: 4px;
            line-height: 1;
        }
        #notes-modal-close:hover { color: var(--text); background: rgba(255,255,255,0.08); }

        #notes-modal-body {
            padding: 0.9rem 1.1rem;
            flex: 1;
            overflow-y: auto;
        }

        #notes-modal-textarea {
            width: 100%;
            background: #141b2d;
            color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-md);
            padding: 0.7rem 0.8rem;
            font-size: 0.85rem;
            font-family: inherit;
            resize: vertical;
            min-height: 200px;
            line-height: 1.65;
            transition: border-color 0.2s;
        }
        #notes-modal-textarea:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(74,158,255,0.12);
        }

        #notes-char-count {
            font-size: 0.68rem;
            color: var(--text-dim);
            text-align: right;
            margin-top: 0.3rem;
        }
        #notes-char-count.near-limit { color: var(--orange); }

        #notes-modal-footer {
            padding: 0.65rem 1.1rem 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            border-top: 1px solid var(--border);
            background: rgba(0,0,0,0.2);
        }

        #notes-save-status {
            font-size: 0.75rem;
            flex: 1;
            color: var(--text-dim);
        }
        #notes-save-status.saving { color: var(--orange); }
        #notes-save-status.saved  { color: var(--green); }
        #notes-save-status.error  { color: var(--red); }

        .modal-btn {
            padding: 0.4rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s, background 0.2s;
        }
        .modal-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        #notes-cancel-btn {
            background: rgba(255,255,255,0.07);
            color: var(--text-dim);
            border: 1px solid var(--border-strong);
        }
        #notes-cancel-btn:hover:not(:disabled) { background: rgba(255,255,255,0.12); }

        #notes-save-btn {
            background: var(--green);
            color: #fff;
        }
        #notes-save-btn:hover:not(:disabled) { background: var(--green-dim); }
    </style>
</head>

<body>
    <!-- Login screen — shown until Google OAuth confirms identity -->
    <div id="login-screen">
        <div id="login-card">
            <div class="lock-icon">🔒</div>
            <h1>A2Z DSA Tracker</h1>
            <p>This is a private tracker.<br>Sign in with your Google account to continue.</p>
            <!-- Google renders its button inside this div -->
            <div id="g_id_signin"></div>
            <div id="login-error">⚠️ Access denied. Only the owner can use this tracker.</div>
        </div>
    </div>

    <!-- Sync status banner: in static HTML so showStatus() always finds it -->
    <div id="sync-status"></div>

    <div id="roadmap-container" class="container" style="display:none">
        <h1>Loading Roadmap…</h1>
    </div>

    <!-- Notes modal: one shared modal for all 455 questions -->
    <div id="notes-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="notes-modal-title" style="display:none">
        <div id="notes-modal">
            <div id="notes-modal-header">
                <span id="notes-modal-title">Notes</span>
                <button id="notes-modal-close" title="Close" aria-label="Close">✕</button>
            </div>
            <div id="notes-modal-body">
                <textarea id="notes-modal-textarea" placeholder="Write your notes here…&#10;&#10;You can include:&#10;• Approach / algorithm notes&#10;• Time &amp; space complexity&#10;• Links to similar problems&#10;• Any reminders for revision"></textarea>
                <div id="notes-char-count">0 / 10,000</div>
            </div>
            <div id="notes-modal-footer">
                <span id="notes-save-status"></span>
                <button id="notes-cancel-btn" class="modal-btn">Cancel</button>
                <button id="notes-save-btn"   class="modal-btn">Save to Sheet</button>
            </div>
        </div>
    </div>

    <script>
    // ═══════════════════════════════════════════════════════════════════
    //  CONFIGURATION
    // ═══════════════════════════════════════════════════════════════════
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_JXbBsXvVQDFFaOLplf3o7csQEl9_i7FsZkEOe0CScvNk0jWs3xLy5yXd9Xuup9WVgA/exec";
    // Example: "https://script.google.com/macros/s/AKfycb.../exec"

    // ── Auth config ──────────────────────────────────────────────────
    // Your Google Client ID
    const GOOGLE_CLIENT_ID = "453398305483-i4bk0070i01vu7nlkl74p8f11bdp3g5m.apps.googleusercontent.com";
    // .apps.googleusercontent.com

    
    const ALLOWED_EMAIL = "kartikverma378@gmail.com";
    // Example: ""
    // ═══════════════════════════════════════════════════════════════════

    const USE_SHEETS = true;

    // Stores the verified ID token from Google — sent with every Sheet request
    // so the Apps Script can verify it server-side
    let googleIdToken = sessionStorage.getItem('gid_token') || null;

    // ── Google OAuth ─────────────────────────────────────────────────
    // Called automatically by Google Identity Services after the user
    // completes sign-in. The credential is a signed JWT from Google.
    function handleGoogleSignIn(response) {
        const token   = response.credential;
        const payload = parseJwt(token);

        if (!payload || !payload.email) {
            showLoginError("Could not read account info. Please try again.");
            return;
        }

        if (payload.email.toLowerCase() !== ALLOWED_EMAIL.toLowerCase()) {
            showLoginError("Access denied. Only " + ALLOWED_EMAIL + " can use this tracker.");
            return;
        }

        // ✅ Correct owner — store token and boot the app
        googleIdToken = token;
        sessionStorage.setItem('gid_token', token);
        localStorage.setItem('gid_remember', '1');
        document.getElementById('login-screen').style.display  = 'none';
        document.getElementById('roadmap-container').style.display = '';
        document.getElementById('notes-modal-overlay').style.display = '';
        bootApp();
    }

    function showLoginError(msg) {
        const el = document.getElementById('login-error');
        el.textContent = '⚠️ ' + msg;
        el.classList.add('show');
    }

    // Decode the JWT payload (no verification needed client-side —
    // Google already signed it; the Apps Script verifies it server-side)
    function parseJwt(token) {
        try {
            const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(atob(base64));
        } catch (e) {
            return null;
        }
    }

    // Initialise the Google Sign-In button once the GIS library is ready
        function initGoogleSignIn() {
        if (typeof google === 'undefined' || !google.accounts) {
            setTimeout(initGoogleSignIn, 200);
            return;
        }

        // If we already have a valid saved token, skip the login screen entirely
        if (googleIdToken) {
            const payload = parseJwt(googleIdToken);
            const now = Math.floor(Date.now() / 1000);
            if (payload && payload.exp && payload.exp > now &&
                payload.email && payload.email.toLowerCase() === ALLOWED_EMAIL.toLowerCase()) {
                // Token is still valid — boot directly, no login screen needed
                document.getElementById('login-screen').style.display  = 'none';
                document.getElementById('roadmap-container').style.display = '';
                document.getElementById('notes-modal-overlay').style.display = '';
                bootApp();
                return;
            } else {
                // Token expired — clear it and fall through to show login
                googleIdToken = null;
                sessionStorage.removeItem('gid_token');
            }
        }

        google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback:  handleGoogleSignIn,
            auto_select: true   // silently signs in if user already consented
        });
        google.accounts.id.renderButton(
            document.getElementById('g_id_signin'),
            { theme: 'filled_black', size: 'large', text: 'signin_with', shape: 'rectangular' }
        );
        // Only prompt One Tap if they've logged in before on this browser
        if (localStorage.getItem('gid_remember')) {
            google.accounts.id.prompt();
        }
    }

    // localStorage keys — used as offline fallback when Sheet is unreachable
    const STORAGE_KEY       = 'dsaRoadmapProgress';
    const NOTES_STORAGE_KEY = 'dsaRoadmapNotes';

    // In-memory caches keyed by topic.id from a2z.json
    let progressCache = {};   // { topicId: true/false }
    let notesCache    = {};   // { topicId: "note text" }

    // title → id lookup, built from a2z.json.
    // Sheet rows are matched by question title (col C); this maps title → topic.id
    let titleToId = {};

    // Modal state
    let modalTopicId    = null;
    let modalTopicTitle = null;

    const platformLogos = {
        'BLOG': `<img src="./assets/logo/post.svg" alt="BLOG">`,
        'YT':   `<img src="./assets/logo/yt.svg"   alt="YT">`,
        'TUF':  `<img src="./assets/logo/tuf.svg"  alt="TUF">`,
        'GFG':  `<img src="./assets/logo/gfg.svg"  alt="GFG">`,
        'CN':   `<img src="./assets/logo/cn.svg"   alt="CN">`,
        'LC':   `<img src="./assets/logo/lc.svg"   alt="LC">`
    };

    // ── Sync status banner ───────────────────────────────────────────
    function showStatus(msg, type, autohideMs) {
        if (autohideMs === undefined) autohideMs = 3000;
        const el = document.getElementById('sync-status');
        if (!el) return;
        el.className = type;
        el.textContent = msg;
        clearTimeout(el._timer);
        if (autohideMs > 0) {
            el._timer = setTimeout(function () {
                el.className = '';
                el.textContent = '';
                el.style.display = '';
            }, autohideMs);
        }
    }

    // ── localStorage helpers ─────────────────────────────────────────
    function loadFromLocalStorage() {
        try {
            const p = localStorage.getItem(STORAGE_KEY);
            const n = localStorage.getItem(NOTES_STORAGE_KEY);
            progressCache = p ? JSON.parse(p) : {};
            notesCache    = n ? JSON.parse(n) : {};
        } catch (e) {
            progressCache = {};
            notesCache    = {};
        }
    }

    function saveToLocalStorage() {
        try {
            localStorage.setItem(STORAGE_KEY,       JSON.stringify(progressCache));
            localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify(notesCache));
        } catch (e) { /* ignore */ }
    }

    // ── Google Sheet communication (GET only — avoids CORS preflight) ─
    //
    //  WHY GET ONLY:
    //  Apps Script Web Apps deployed as "Anyone" do not respond to the
    //  CORS OPTIONS preflight that browsers send before POST+JSON requests
    //  from a cross-origin page (e.g. GitHub Pages → script.google.com).
    //  The browser drops the POST before it ever reaches the script.
    //  Using GET with URL-encoded params bypasses the preflight entirely.

    async function loadFromSheet() {
        const params = new URLSearchParams({ action: "getAll", token: googleIdToken });
        const url = APPS_SCRIPT_URL + "?" + params.toString();
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        // data = { "lowercased question title": { done: bool, notes: str } }
        // Convert title keys to topic ids using the titleToId map
        for (const titleKey in data) {
            const id = titleToId[titleKey];
            if (!id) continue;
            progressCache[id] = data[titleKey].done  || false;
            notesCache[id]    = data[titleKey].notes || "";
        }
    }

    async function pushToSheet(topicTitle, done, notes) {
        // All params go in the URL as GET query string — no POST body, no preflight
        const params = new URLSearchParams({
            action: "update",
            title:  topicTitle,
            done:   done ? "true" : "false",
            notes:  notes || "",
            token:  googleIdToken    // Google ID token verified server-side
        });
        const url = APPS_SCRIPT_URL + "?" + params.toString();
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        return data;
    }

    // ── Bootstrap ────────────────────────────────────────────────────
    // Start by showing the login screen and initialising Google Sign-In.
    // bootApp() is called only after the owner's identity is confirmed.
    document.addEventListener('DOMContentLoaded', function () {
        initGoogleSignIn();
    });

    function bootApp() {
        fetch('a2z.json')
            .then(function (response) {
                if (!response.ok) throw new Error('Could not load a2z.json. Make sure it is in the same folder.');
                return response.json();
            })
            .then(async function (roadmapData) {

                // Build titleToId map from a2z.json
                roadmapData.forEach(function (step) {
                    if (!step.sub_steps) return;
                    step.sub_steps.forEach(function (subStep) {
                        subStep.topics.forEach(function (topic) {
                            titleToId[topic.question_title.trim().toLowerCase()] = topic.id;
                        });
                    });
                });

                // Load progress data
                if (USE_SHEETS) {
                    showStatus('⏳ Syncing with Google Sheet…', 'info', 0);
                    try {
                        await loadFromSheet();
                        showStatus('✅ Synced with Google Sheet', 'success', 3000);
                    } catch (err) {
                        console.error("Sheet load error:", err);
                        showStatus('⚠️ Could not reach Google Sheet (' + err.message + '). Using local cache.', 'warning', 8000);
                        loadFromLocalStorage();
                    }
                } else {
                    showStatus('ℹ️ Running in local mode. Set APPS_SCRIPT_URL to sync with Google Sheet.', 'warning', 8000);
                    loadFromLocalStorage();
                }

                generateRoadmap(roadmapData);
                addEventListeners();
                initNotesModal();
            })
            .catch(handleError);
    }

    // ── Roadmap rendering ────────────────────────────────────────────
    function generateRoadmap(data) {
        const container = document.getElementById('roadmap-container');
        let htmlContent = `
            <div class="roadmap-header">
                <h1>A2Z DSA Course Roadmap</h1>
                <div class="header-right">
                    <span id="user-display"></span>
                    <button type="button" id="logout-btn" class="logout-btn">Sign out</button>
                    <button type="button" id="toggle-all" class="toggle-all-btn">Expand all</button>
                </div>
            </div>`;

        data.forEach(function (step) {
            let totalStepTopics = 0;
            let completedStepTopics = 0;
            let subStepsHtml = '';

            if (step.sub_steps) {
                step.sub_steps.forEach(function (subStep) {
                    const totalSubStepTopics = subStep.topics.length;
                    const completedSubStepTopics = subStep.topics.filter(function (t) {
                        return progressCache[t.id];
                    }).length;
                    const isSubStepComplete = totalSubStepTopics > 0 && completedSubStepTopics === totalSubStepTopics;
                    const subStepProgressClass = isSubStepComplete ? 'completed' : '';
                    const subStepPercentage = totalSubStepTopics > 0 ? (completedSubStepTopics / totalSubStepTopics) * 100 : 0;
                    totalStepTopics += totalSubStepTopics;
                    completedStepTopics += completedSubStepTopics;

                    subStepsHtml += `
                            <button type="button" class="sub-collapsible ${subStepProgressClass}" style="--progress-width: ${subStepPercentage}%" data-step="${step.step_no}" data-substep="${subStep.sub_step_no}">
                                <span class="collapsible-title">${subStep.sub_step_no}. ${subStep.sub_step_title.replace(/\n/g, ' ')}</span>
                                <span class="progress-counter">${completedSubStepTopics}/${totalSubStepTopics}</span>
                            </button>
                            <div class="sub-content">
                                <div class="table-container">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Topic</th>
                                                <th title="Blog">BLOG</th>

                                                <th title="YouTube">YT</th>
                                                <th title="LeetCode">LC</th>
                                                <th title="GeeksForGeeks">GFG</th>
                                                <th title="CodingNinjas">CN</th>
                                                <th title="TakeUForward+">TUF</th>
                                                <th>Done</th>
                                                <th class="notes-header">Notes</th>
                                            </tr>
                                        </thead>
                                        <tbody>`;

                    subStep.topics.forEach(function (topic) {
                        const isCompleted   = progressCache[topic.id] || false;
                        const hasNotes      = !!(notesCache[topic.id] && notesCache[topic.id].trim());
                        const diffClass     = getDifficultyClass(topic.difficulty);
                        const completedClass = isCompleted ? 'completed' : '';
                        const checkedAttr   = isCompleted ? 'checked' : '';
                        const notesBtnClass = hasNotes ? 'notes-btn has-notes' : 'notes-btn';
                        const notesBtnLabel = hasNotes ? '📝 Edit' : '+ Notes';

                        // Escape the title for safe use in HTML attributes
                        const safeTitle = topic.question_title
                            .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
                            .replace(/</g,'&lt;').replace(/>/g,'&gt;');

                        let tags = '';
                        if (topic.ques_topic) {
                            try {
                                const parsedTags = JSON.parse(topic.ques_topic);
                                tags = parsedTags.map(function (t) { return t.label; }).join(', ');
                            } catch (e) { /* ignore */ }
                        }

                        subStepsHtml += `
                                            <tr class="${diffClass} ${completedClass}"
                                                data-topic-id="${topic.id}"
                                                data-topic-title="${safeTitle}">
                                                <td class="topic-cell" title="${tags}">
                                                    <div class="topic-title">${topic.question_title}</div>
                                                </td>
                                                ${createLinkCell(topic.post_link, 'BLOG')}

                                                ${createLinkCell(topic.yt_link, 'YT')}
                                                ${createLinkCell(topic.lc_link, 'LC')}
                                                ${createLinkCell(topic.gfg_link, 'GFG')}
                                                ${createLinkCell(topic.cs_link, 'CN')}
                                                ${createLinkCell(topic.plus_link, 'TUF')}
                                                <td class="status-cell">
                                                    <input type="checkbox" class="status-checkbox"
                                                           data-id="${topic.id}" ${checkedAttr}>
                                                </td>
                                                <td class="notes-cell">
                                                    <button type="button"
                                                            class="${notesBtnClass}"
                                                            data-id="${topic.id}"
                                                            data-title="${safeTitle}"
                                                            title="${hasNotes ? 'Edit notes' : 'Add notes'}">
                                                        ${notesBtnLabel}
                                                    </button>
                                                </td>
                                            </tr>`;
                    });

                    subStepsHtml += `
                                        </tbody>
                                    </table>
                                </div>
                            </div>`;
                });
            }

            const isStepComplete = totalStepTopics > 0 && completedStepTopics === totalStepTopics;
            const stepProgressClass = isStepComplete ? 'completed' : '';
            const stepPercentage = totalStepTopics > 0 ? (completedStepTopics / totalStepTopics) * 100 : 0;

            htmlContent += `
                        <button type="button" class="collapsible ${stepProgressClass}" style="--progress-width: ${stepPercentage}%" data-step="${step.step_no}">
                            <span class="collapsible-title">Step ${step.step_no}: ${step.step_title}</span>
                            <span class="progress-counter">${completedStepTopics}/${totalStepTopics}</span>
                        </button>
                        <div class="content">${subStepsHtml}</div>`;
        });

        container.innerHTML = htmlContent;
    }

    function createLinkCell(url, label) {
        if (url) {
            const logo = platformLogos[label] || label;
            return `<td class="link-cell"><a href="${url}" target="_blank" rel="noopener noreferrer" title="${label}">${logo}</a></td>`;
        }
        return `<td class="na-cell">-</td>`;
    }

    function getDifficultyClass(difficulty) {
        return ['difficulty-easy', 'difficulty-medium', 'difficulty-hard'][difficulty] || '';
    }

    // ── Counter updates ──────────────────────────────────────────────
    function updateCounters(element) {
        const subStepContent = element.closest('.sub-content');
        if (subStepContent) {
            const subStepButton = subStepContent.previousElementSibling;
            const boxes = Array.from(subStepContent.querySelectorAll('.status-checkbox'));
            const total = boxes.length;
            const done  = boxes.filter(function (cb) { return progressCache[cb.dataset.id]; }).length;
            subStepButton.querySelector('.progress-counter').textContent = done + '/' + total;
            const pct = total > 0 ? (done / total) * 100 : 0;
            subStepButton.style.setProperty('--progress-width', pct + '%');
            subStepButton.classList.toggle('completed', total > 0 && done === total);
        }
        const mainContent = element.closest('.content');
        if (mainContent) {
            const mainStepButton = mainContent.previousElementSibling;
            const boxes = Array.from(mainContent.querySelectorAll('.status-checkbox'));
            const total = boxes.length;
            const done  = boxes.filter(function (cb) { return progressCache[cb.dataset.id]; }).length;
            mainStepButton.querySelector('.progress-counter').textContent = done + '/' + total;
            const pct = total > 0 ? (done / total) * 100 : 0;
            mainStepButton.style.setProperty('--progress-width', pct + '%');
            mainStepButton.classList.toggle('completed', total > 0 && done === total);
        }
    }

    // ── Notes modal ──────────────────────────────────────────────────
    function initNotesModal() {
        const overlay  = document.getElementById('notes-modal-overlay');
        const textarea = document.getElementById('notes-modal-textarea');
        const title    = document.getElementById('notes-modal-title');
        const closeBtn = document.getElementById('notes-modal-close');
        const cancelBtn = document.getElementById('notes-cancel-btn');
        const saveBtn  = document.getElementById('notes-save-btn');
        const status   = document.getElementById('notes-save-status');
        const charCount = document.getElementById('notes-char-count');
        const MAX_CHARS = 10000;

        function openModal(topicId, topicTitle) {
            modalTopicId    = topicId;
            modalTopicTitle = topicTitle;
            const existing  = notesCache[topicId] || '';
            title.textContent   = topicTitle;
            textarea.value      = existing;
            status.textContent  = '';
            status.className    = '';
            saveBtn.disabled    = false;
            updateCharCount();
            overlay.classList.add('open');
            textarea.focus();
        }

        function closeModal() {
            overlay.classList.remove('open');
            modalTopicId    = null;
            modalTopicTitle = null;
        }

        function updateCharCount() {
            const len = textarea.value.length;
            charCount.textContent = len + ' / ' + MAX_CHARS;
            charCount.className   = len > MAX_CHARS * 0.85 ? 'near-limit' : '';
        }

        textarea.addEventListener('input', updateCharCount);

        // Close on overlay click (outside modal box)
        overlay.addEventListener('click', function (e) {
            if (e.target === overlay) closeModal();
        });

        closeBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);

        // Esc key closes modal
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
        });

        saveBtn.addEventListener('click', async function () {
            if (!modalTopicId || !modalTopicTitle) return;

            const text = textarea.value.trim();
            saveBtn.disabled   = true;
            status.textContent = '💾 Saving…';
            status.className   = 'saving';

            // Update local cache immediately
            notesCache[modalTopicId] = text;
            saveToLocalStorage();

            // Update the Notes button label in the table
            refreshNotesBtnInTable(modalTopicId, text);

            if (USE_SHEETS) {
                try {
                    await pushToSheet(modalTopicTitle, progressCache[modalTopicId] || false, text);
                    status.textContent = '✅ Saved to Google Sheet';
                    status.className   = 'saved';
                    saveBtn.disabled   = false;
                    // Auto-close after short delay so user sees the confirmation
                    setTimeout(closeModal, 1000);
                } catch (err) {
                    console.error("Notes save error:", err);
                    status.textContent = '⚠️ Sheet error: ' + err.message + '. Saved locally.';
                    status.className   = 'error';
                    saveBtn.disabled   = false;
                }
            } else {
                status.textContent = '✅ Saved locally';
                status.className   = 'saved';
                saveBtn.disabled   = false;
                setTimeout(closeModal, 800);
            }
        });
    }

    // Update the Notes button in the table row after saving
    function refreshNotesBtnInTable(topicId, text) {
        const btn = document.querySelector('.notes-btn[data-id="' + topicId + '"]');
        if (!btn) return;
        const hasNotes = !!(text && text.trim());
        btn.className = hasNotes ? 'notes-btn has-notes' : 'notes-btn';
        btn.textContent = hasNotes ? '📝 Edit' : '+ Notes';
        btn.title = hasNotes ? 'Edit notes' : 'Add notes';
    }

    // ── Event listeners ──────────────────────────────────────────────
    function addEventListeners() {
        const container    = document.getElementById('roadmap-container');
        const toggleAllBtn = document.getElementById('toggle-all');

        function updateToggleAllLabel() {
            if (!toggleAllBtn) return;
            const hasExpanded = container.querySelector('.collapsible.active, .sub-collapsible.active');
            toggleAllBtn.textContent = hasExpanded ? 'Collapse all' : 'Expand all';
        }

        container.addEventListener('click', function (event) {
            // Notes button click → open modal
            const notesBtn = event.target.closest('.notes-btn');
            if (notesBtn) {
                event.stopPropagation();
                openNotesModal(notesBtn.dataset.id, notesBtn.dataset.title);
                return;
            }

            // Don't collapse section when clicking a notes button
            if (event.target.closest('.notes-cell')) return;

            const collapsible = event.target.closest('.collapsible, .sub-collapsible');
            const statusCell  = event.target.closest('.status-cell');

            if (collapsible) {
                collapsible.classList.toggle('active');
                const content = collapsible.nextElementSibling;
                if (content.style.maxHeight) {
                    content.style.maxHeight = null;
                } else {
                    content.style.maxHeight = content.scrollHeight + "px";
                    const parentContent = content.closest('.content');
                    if (parentContent && parentContent.style.maxHeight) {
                        parentContent.style.maxHeight = (parentContent.scrollHeight + content.scrollHeight) + "px";
                    }
                }
                updateToggleAllLabel();
            }

            if (statusCell) {
                const checkbox = statusCell.querySelector('.status-checkbox');
                if (checkbox) {
                    checkbox.checked = !checkbox.checked;
                    const topicId       = checkbox.dataset.id;
                    const isChecked     = checkbox.checked;
                    const row           = checkbox.closest('tr');
                    const questionTitle = row ? row.dataset.topicTitle : '';

                    // Update cache and localStorage immediately
                    progressCache[topicId] = isChecked;
                    saveToLocalStorage();
                    checkbox.closest('tr').classList.toggle('completed', isChecked);
                    updateCounters(checkbox);

                    // Push to Sheet asynchronously
                    if (USE_SHEETS) {
                        showStatus('💾 Saving…', 'info', 0);
                        pushToSheet(questionTitle, isChecked, notesCache[topicId] || '')
                            .then(function () {
                                showStatus('✅ Saved to Google Sheet', 'success', 2500);
                            })
                            .catch(function (err) {
                                console.error("Checkbox save error:", err);
                                showStatus('⚠️ Save failed: ' + err.message + '. Saved locally.', 'error', 6000);
                            });
                    }
                }
            }
        });

        // Logout button
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function () {
                sessionStorage.removeItem('gid_token');
                localStorage.removeItem('gid_remember');
                googleIdToken = null;
                if (typeof google !== 'undefined' && google.accounts) {
                    google.accounts.id.disableAutoSelect();
                }
                location.reload();
            });
        }

        // Set user display name (works for both fresh login and cached token)
        const userDisplay = document.getElementById('user-display');
        if (userDisplay && googleIdToken) {
            const p = parseJwt(googleIdToken);
            if (p) userDisplay.textContent = '👤 ' + (p.name || p.email);
        }

        if (toggleAllBtn) {
            toggleAllBtn.addEventListener('click', function () {
                const allButtons = Array.from(container.querySelectorAll('.collapsible, .sub-collapsible'));
                const hasExpanded = allButtons.some(function (b) { return b.classList.contains('active'); });

                if (!hasExpanded) {
                    // Expand nested sections first so parent scrollHeights are correct.
                    Array.from(container.querySelectorAll('.sub-collapsible')).forEach(function (btn) {
                        btn.classList.add('active');
                        const content = btn.nextElementSibling;
                        if (content) content.style.maxHeight = "none";
                    });
                    Array.from(container.querySelectorAll('.collapsible')).forEach(function (btn) {
                        btn.classList.add('active');
                        const content = btn.nextElementSibling;
                        if (content) content.style.maxHeight = "none";
                    });
                } else {
                    Array.from(container.querySelectorAll('.content, .sub-content'))
                        .forEach(function (c) { c.style.maxHeight = null; });
                    allButtons.forEach(function (btn) { btn.classList.remove('active'); });
                }

                updateToggleAllLabel();
            });
        }

        updateToggleAllLabel();
    }

    // ── Open notes modal helper ──────────────────────────────────────
    function openNotesModal(topicId, topicTitle) {
        const overlay  = document.getElementById('notes-modal-overlay');
        const textarea = document.getElementById('notes-modal-textarea');
        const titleEl  = document.getElementById('notes-modal-title');
        const status   = document.getElementById('notes-save-status');
        const saveBtn  = document.getElementById('notes-save-btn');
        const charCount = document.getElementById('notes-char-count');

        modalTopicId    = topicId;
        modalTopicTitle = topicTitle;

        const existing = notesCache[topicId] || '';
        titleEl.textContent   = topicTitle;
        textarea.value        = existing;
        status.textContent    = '';
        status.className      = '';
        saveBtn.disabled      = false;
        charCount.textContent = existing.length + ' / 10,000';
        charCount.className   = existing.length > 8500 ? 'near-limit' : '';

        overlay.classList.add('open');
        textarea.focus();
    }

    function handleError(error) {
        console.error('Error:', error);
        document.getElementById('roadmap-container').innerHTML = `
            <h1>Error</h1>
            <p>Could not load the roadmap. Please ensure 'a2z.json' is in the same directory and correctly formatted.</p>
            <p><em>${error.message}</em></p>`;
    }
    </script>
